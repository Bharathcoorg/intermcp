[package]
name = "intermcp"
version = "0.2.0"
edition = "2021"
authors = ["Bharath B R <bharathcoorg7@gmail.com>"]
description = "Ultra-fast, safe Model Context Protocol (MCP) engine and multiplexing hub in pure Rust, built for Interlayer and open for all"
license = "MIT"
repository = "https://github.com/Bharathcoorg/intermcp"
rust-version = "1.75"
keywords = ["mcp", "mcp-protocol", "ai", "claude", "interlayer"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
thiserror = "2.0"
aho-corasick = "1.1"
dunce = "1.0"
subtle = "2.5"
tempfile = "3.10"
toml = "0.8"
parking_lot = "0.12"
sha2 = "0.10"
rand = "0.8"
serde_jcs = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "intermcp"
path = "src/main.rs"

[lib]
name = "intermcp"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
