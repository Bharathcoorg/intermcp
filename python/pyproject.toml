[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intermcp"
version = "0.2.0"
authors = [
  { name = "Bharath B R", email = "bharathcoorg7@gmail.com" },
]
description = "Ultra-Fast, Safe Model Context Protocol (MCP) Python Client for Interlayer Blockchain InterMCP Trust Runtime"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "mcp",
    "model-context-protocol",
    "mcp-client",
    "mcp-server",
    "mcp-runtime",
    "ai",
    "ai-agents",
    "agentic-ai",
    "autonomous-agents",
    "function-calling",
    "tool-calling",
    "blockchain",
    "interlayer",
    "interlayer-blockchain",
    "web3",
    "decentralized-ai",
    "claude",
    "claude-desktop",
    "cursor",
    "windsurf",
    "cline",
    "llm",
    "zero-trust",
    "runtime-security"
]

[project.urls]
"Homepage" = "https://github.com/Bharathcoorg/intermcp"
"Bug Tracker" = "https://github.com/Bharathcoorg/intermcp/issues"
