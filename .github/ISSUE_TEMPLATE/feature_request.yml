name: Feature Request
description: Suggest an idea, new MCP tool, or runtime capability for InterMCP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome feature suggestions and ideas!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or limitation?
      description: A clear and concise description of what the problem is (e.g. "I'm always frustrated when...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Ideal Experience
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
